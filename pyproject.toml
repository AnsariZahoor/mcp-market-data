[project]
name = "crypto-mcp"
version = "0.1.0"
description = "MCP server for cryptocurrency exchange data (Binance, Bybit, Hyperliquid)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.11.0",
    "pydantic>=2.0,<2.12",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "pandas>=2.0.0",
    "pandas-ta>=0.4.71b0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "py-key-value-aio>=0.3.0",
    "cryptography>=42.0.0",
    "authlib>=1.3.0",
]

[project.scripts]
crypto-mcp = "crypto_mcp.server:main"

[tool.setuptools.packages.find]
include = ["crypto_mcp*"]

[tool.uv]
package = true
